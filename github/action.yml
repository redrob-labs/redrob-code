name: "Redrob Code GitHub Action"
description: "Run Redrob Code in GitHub Actions workflows"
branding:
  icon: "code"
  color: "orange"

inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  share:
    description: "Share the Redrob Code session (defaults to true for public repos)"
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  token:
    description: "GitHub token the agent acts with: the workflow's own GITHUB_TOKEN (the default) or a personal access token with contents, pull-requests and issues write access. There is no GitHub App or token exchange; this token is the only credential."
    required: false
    default: ${{ github.token }}

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/redrob,/rr,/opencode,/oc' -- the upstream phrases are kept for compatibility"
    required: false

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

runs:
  using: "composite"
  steps:
    - name: Get redrob version
      id: version
      shell: bash
      run: |
        VERSION=$(curl -sf https://api.github.com/repos/redrob-labs/redrob-code/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
        echo "version=${VERSION:-latest}" >> $GITHUB_OUTPUT

    - name: Cache redrob
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.redrob/bin
        key: redrob-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install redrob
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: curl -fsSL https://console.redrob.ai/code/install.sh | sh

    - name: Add redrob to PATH
      shell: bash
      run: echo "$HOME/.redrob/bin" >> $GITHUB_PATH

    - name: Run redrob
      shell: bash
      id: run_redrob
      run: redrob github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        GITHUB_TOKEN: ${{ inputs.token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
