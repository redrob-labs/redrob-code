# The Rust client for the shared daemon (crates/engine-client). Runs only when the crate or
# this file changes: the rest of the repository is TypeScript and does not need a Rust toolchain.
name: engine-client

on:
  pull_request:
    paths:
      - "crates/engine-client/**"
      - ".github/workflows/engine-client.yml"
  # By hand: fmt and tests too. A pull request only compiles (clippy, no test targets).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Linux only: the crate has no OS-specific code paths worth a per-OS leg on every PR.
    name: engine-client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/engine-client
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/engine-client
      - if: github.event_name != 'pull_request'
        run: cargo fmt --all -- --check
      - if: github.event_name == 'pull_request'
        run: cargo clippy --locked -- -D warnings
      - if: github.event_name != 'pull_request'
        run: cargo clippy --all-targets --locked -- -D warnings
      - if: github.event_name != 'pull_request'
        run: cargo test --locked
