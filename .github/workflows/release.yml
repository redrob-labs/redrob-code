name: release

# Build, sign, and publish a Redrob Code release.
#
# Versions are ours and start at 0.1.0. They are NOT derived from the upstream version
# this tree is built on: that provenance lives in `UPSTREAM_VERSION` at the repository
# root, which the release notes read. See docs/VERSIONING.md for why the old
# `1.18.31-redrob.N` shape was retired.
#
# `workflow_dispatch` ONLY. This job reaches real signing credentials, so it must never be
# reachable from a pull request, a comment, or a schedule. Dispatch requires write access
# to this repository, which is the access control.
#
# It does not push to `main`. The last step opens a pull request from `develop` into
# `main`, because `main` is what people believe is released and advancing it deserves the
# same review as anything else -- it is also the one branch where an unreviewed automated
# push would be hard to notice. See docs/BRANCHING.md.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to advance."
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Build and sign, but publish nothing."
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  # For actions/attest-build-provenance. Provenance is free to produce and is the one
  # thing that lets someone verify an artifact came from this repository and this workflow
  # rather than from a machine that had the signing keys.
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.bump }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    # Pinned to this repository's immutable id, not its name. A fork must never run this,
    # and a rename must not silently switch the check off -- a false `if:` SKIPS a job
    # rather than failing it, which is invisible behind a green checkmark.
    if: github.repository_id == '1371675259'
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      upstream: ${{ steps.compute.outputs.upstream }}
    steps:
      # Tags are the version state, so this job needs them. `fetch-tags` alone is not
      # enough with a shallow checkout: the tag objects arrive without the commits they
      # point at and `--sort=-v:refname` then has nothing to order.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: develop
          fetch-depth: 0

      - id: compute
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          # Only plain `vMAJOR.MINOR.PATCH` counts. Anything carrying a `-` is a prerelease
          # or a legacy upstream-derived tag, and letting one of those win here would make
          # the next version a continuation of a line we deliberately left behind.
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
            | grep -v -- '-' | head -n1 || true)"
          if [ -z "$latest" ]; then
            # No release yet. A `minor` bump from here is 0.1.0, which is the first release.
            current="0.0.0"
            echo "::notice::no existing release tag; bumping from $current"
          else
            current="${latest#v}"
            echo "::notice::newest release tag is $latest"
          fi
          major="${current%%.*}"
          rest="${current#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::unknown bump '$BUMP'"; exit 1 ;;
          esac
          version="${major}.${minor}.${patch}"
          if git rev-parse --verify --quiet "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version already exists; a release cannot be recomputed onto an existing tag"
            exit 1
          fi
          # The upstream version the tag no longer carries. Absent is a defect rather than
          # a blank field: the release notes state what this is built on, and a release
          # that cannot say so should not be published.
          if [ ! -s UPSTREAM_VERSION ]; then
            echo "::error::UPSTREAM_VERSION is missing or empty; see docs/VERSIONING.md"
            exit 1
          fi
          upstream="$(tr -d '[:space:]' < UPSTREAM_VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "::notice::releasing v$version (built on opencode v$upstream)"

  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: develop
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun

      # Bun cross-compiles every target from one host, so there is no build matrix and
      # every artifact in a release comes from a single commit and a single toolchain.
      - name: Build
        run: |
          ./packages/redrob/script/build.ts
        env:
          REDROB_VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-unsigned
          path: |
            packages/redrob/dist/redrob-darwin*
            packages/redrob/dist/redrob-linux*
            packages/redrob/dist/redrob-windows*

  sign-macos:
    needs: [version, build]
    runs-on: macos-14
    env:
      APPLE_CODESIGN_CERT_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
      APPLE_CODESIGN_CERT_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
      APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
      APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
      APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-unsigned
          path: dist

      # Fail here rather than three steps later inside codesign, where the error is about
      # a keychain and says nothing about the missing secret that caused it.
      - name: Require the Apple credentials
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_CODESIGN_CERT_P12_BASE64 \
            APPLE_CODESIGN_CERT_PASSWORD \
            APPLE_NOTARY_API_KEY_P8_BASE64 \
            APPLE_NOTARY_API_KEY_ID \
            APPLE_NOTARY_API_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing macOS signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Import the Developer ID certificate
        run: |
          set -euo pipefail
          p12="$RUNNER_TEMP/signing.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CODESIGN_CERT_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$APPLE_CODESIGN_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::no Developer ID Application identity in the imported certificate"
            exit 1
          fi
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "APPLE_SIGNING_IDENTITY=$identity"
            echo "APPLE_SIGNING_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Sign and notarize
        run: |
          set -euo pipefail
          shopt -s nullglob
          binaries=(dist/redrob-darwin-*/bin/redrob)
          if [ "${#binaries[@]}" -lt 2 ]; then
            echo "::error::expected darwin arm64 and x64 binaries, found ${#binaries[@]}"
            exit 1
          fi
          for binary in "${binaries[@]}"; do
            chmod 755 "$binary"
            # --options runtime is the hardened runtime, without which notarization is
            # rejected. --timestamp is required for the signature to outlive the cert.
            codesign --force --options runtime --timestamp \
              --keychain "$APPLE_SIGNING_KEYCHAIN" --sign "$APPLE_SIGNING_IDENTITY" "$binary"
            codesign --verify --strict --verbose=2 "$binary"
            archive="$RUNNER_TEMP/$(basename "$(dirname "$(dirname "$binary")")").zip"
            ditto -c -k --keepParent "$binary" "$archive"
            xcrun notarytool submit "$archive" \
              --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$APPLE_NOTARY_API_KEY_ID" \
              --issuer "$APPLE_NOTARY_API_ISSUER_ID" \
              --wait
          done

      - name: Repack
        working-directory: dist
        run: |
          set -euo pipefail
          for directory in redrob-darwin-*; do
            [ -d "$directory" ] || continue
            (cd "$directory/bin" && zip -qr "../../${directory}.zip" .)
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-macos-signed
          path: dist/redrob-darwin-*.zip

      # `if: always()` so a failed notarization still takes the private key off the runner.
      - name: Delete the signing keychain
        if: always()
        run: |
          if [ -n "${APPLE_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$APPLE_SIGNING_KEYCHAIN" || true
          fi

  sign-windows:
    needs: [version, build]
    runs-on: windows-latest
    outputs:
      # Carried to `publish` so the release notes state what actually happened. Notes that
      # claim a signature the run did not produce are worse than no claim: a reader has no
      # way to tell, and the whole point of saying "signed" is that it can be relied on.
      signed: ${{ steps.result.outputs.signed }}
      # Separate from `signed`: the binaries can be signed while the installer is not, and the
      # notes must not round one up into the other.
      installer: ${{ steps.installer-result.outputs.installer }}
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
      AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      # This job used to download the build and nothing else, because signing needs only the
      # artifact. The installer definition lives in the repository, so it needs a checkout -- and
      # without one `ISCC` was handed a path to a file that was never on the runner. Sparse, because
      # cloning this whole repository to read one .iss file is a minute of clone for nothing.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          sparse-checkout: installer
          sparse-checkout-cone-mode: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-unsigned
          path: dist

      # There are two ways to sign here and the choice is made once, up front, so no later
      # step re-derives it and a half-configured method is reported as such rather than
      # failing inside an Azure login with an unrelated message.
      #
      # Azure Trusted Signing is preferred when configured: the key never reaches the
      # runner. The organization Authenticode PFX is the fallback, and it does put a private
      # key on the runner, which is why it is second and why the file is deleted immediately
      # after use.
      - name: Detect the signing configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          azure_present=0
          azure_missing=()
          for name in \
            AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            AZURE_ARTIFACT_SIGNING_ENDPOINT AZURE_ARTIFACT_SIGNING_ACCOUNT \
            AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE; do
            if [ -n "${!name:-}" ]; then azure_present=$((azure_present + 1)); else azure_missing+=("$name"); fi
          done

          pfx_present=0
          pfx_missing=()
          for name in WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [ -n "${!name:-}" ]; then pfx_present=$((pfx_present + 1)); else pfx_missing+=("$name"); fi
          done

          # A PARTIAL configuration is a mistake, not a choice, so it is fatal either way --
          # silently falling back from a half-configured Azure to a PFX would hide the
          # mistake and sign with something other than what was intended.
          if [ "$azure_present" -gt 0 ] && [ "$azure_present" -lt 6 ]; then
            echo "::error::partial Azure signing configuration; missing: ${azure_missing[*]}"
            exit 1
          fi
          if [ "$pfx_present" -eq 1 ]; then
            echo "::error::partial Authenticode configuration; missing: ${pfx_missing[*]}"
            exit 1
          fi

          if [ "$azure_present" -eq 6 ]; then
            echo "method=azure" >> "$GITHUB_OUTPUT"
            echo "::notice::signing Windows binaries with Azure Trusted Signing"
          elif [ "$pfx_present" -eq 2 ]; then
            echo "method=pfx" >> "$GITHUB_OUTPUT"
            echo "::notice::signing Windows binaries with the organization Authenticode certificate"
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
            echo "::warning::no Windows signing method is configured; the binaries will be unsigned"
          fi

      - name: Azure login
        if: steps.config.outputs.method == 'azure'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Sign with Azure Trusted Signing
        id: sign-azure
        continue-on-error: true
        if: steps.config.outputs.method == 'azure'
        uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1.2.0
        with:
          endpoint: ${{ env.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}\dist\redrob-windows-arm64\bin\redrob.exe
            ${{ github.workspace }}\dist\redrob-windows-x64\bin\redrob.exe
            ${{ github.workspace }}\dist\redrob-windows-x64-baseline\bin\redrob.exe
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      # The fallback. Unlike Trusted Signing this puts a private key on the runner, so the
      # PFX is written, imported, and deleted within the one step -- `finally` so a signing
      # failure does not leave it behind.
      - name: Sign with the organization Authenticode certificate
        id: sign-pfx
        continue-on-error: true
        if: steps.config.outputs.method == 'pfx'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "redrob-code-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CSC_LINK))
            $password = ConvertTo-SecureString $env:WIN_CSC_KEY_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $cert.Thumbprint) { throw "the organization PFX did not import" }
            $files = @(
              "${{ github.workspace }}\dist\redrob-windows-arm64\bin\redrob.exe",
              "${{ github.workspace }}\dist\redrob-windows-x64\bin\redrob.exe",
              "${{ github.workspace }}\dist\redrob-windows-x64-baseline\bin\redrob.exe"
            )
            foreach ($file in $files) {
              # Timestamped, so the signature outlives the certificate's own validity.
              $result = Set-AuthenticodeSignature -FilePath $file -Certificate $cert `
                -HashAlgorithm SHA256 -TimestampServer http://timestamp.digicert.com
              if (-not $result.SignerCertificate) {
                throw "Authenticode signing failed for ${file}: $($result.StatusMessage)"
              }
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      # Reads the signature back off the artifacts rather than trusting the signing step's
      # exit code. This is what makes "signed" in the release notes a checked claim: the
      # previous release said Windows was signed while nothing had signed it.
      - name: Verify the Windows signatures
        id: verify
        continue-on-error: true
        if: steps.config.outputs.method != 'none'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(
            "${{ github.workspace }}\dist\redrob-windows-arm64\bin\redrob.exe",
            "${{ github.workspace }}\dist\redrob-windows-x64\bin\redrob.exe",
            "${{ github.workspace }}\dist\redrob-windows-x64-baseline\bin\redrob.exe"
          )
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            if (-not $sig.SignerCertificate) {
              throw "no Authenticode signer certificate on ${file}"
            }
            # A runner does not trust the organization's own CA chain, so `NotTrusted` and
            # `UnknownError` are expected for the PFX path and mean "signed, chain not
            # verifiable here" rather than "unsigned". Trusted Signing must be outright Valid.
            $accepted = if ("${{ steps.config.outputs.method }}" -eq "azure") { @("Valid") } else { @("Valid", "UnknownError", "NotTrusted") }
            if ($accepted -notcontains $sig.Status.ToString()) {
              throw "unexpected signature status on ${file}: $($sig.Status) $($sig.StatusMessage)"
            }
            Write-Host "$([IO.Path]::GetFileName($file)): $($sig.Status), signer $($sig.SignerCertificate.Subject)"
          }

      - name: Record the signing outcome
        id: result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          method="${{ steps.config.outputs.method }}"
          case "$method" in
            azure) signed="${{ steps.sign-azure.outcome }}" ;;
            pfx)   signed="${{ steps.sign-pfx.outcome }}" ;;
            *)     signed="skipped" ;;
          esac
          # Both the signing step AND the read-back have to succeed. Either alone can be
          # green while the artifacts are unsigned.
          if [ "$signed" = "success" ] && [ "${{ steps.verify.outcome }}" = "success" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Windows binaries signed via $method and verified"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the Windows binaries in this release are NOT signed"
          fi

      # ── The installer ─────────────────────────────────────────────────────────────────────
      #
      # Built HERE rather than in `build`, and specifically after the signing steps above, because
      # the installer embeds the binary: building it earlier would wrap an unsigned redrob.exe in a
      # signed installer, so Windows would accept the download and then ship an unsigned program.
      # Signing is therefore two-stage -- payload first, wrapper second -- and both stages are read
      # back before the release notes are allowed to claim either.
      - name: Build the Windows installer
        id: installer
        # continue-on-error, like every other step in this job. The installer is an ADDITION to the
        # release; a failure here must not stop the binaries being repacked and uploaded. The first
        # run proved the point -- the build failed and took Repack and the upload with it, so a
        # missing installer would have meant no Windows assets at all.
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Inno Setup ships on the windows-latest image via Chocolatey. Pinned rather than latest:
          # an installer definition is not something to have silently recompiled by a new major.
          choco install innosetup --version=6.2.2 --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc `
            "/DAppVersion=${{ needs.version.outputs.version }}" `
            "/DSourceBin=${{ github.workspace }}\dist\redrob-windows-x64\bin" `
            "/O${{ github.workspace }}\dist" `
            "${{ github.workspace }}\installer\windows\redrob-code.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          $setup = "${{ github.workspace }}\dist\redrob-code-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "the installer was not produced at $setup" }
          Write-Host "built $((Get-Item $setup).Length) bytes"

      - name: Sign the installer with Azure Trusted Signing
        id: sign-installer-azure
        continue-on-error: true
        if: steps.config.outputs.method == 'azure'
        uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1.2.0
        with:
          endpoint: ${{ env.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}\dist\redrob-code-x64-setup.exe
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Sign the installer with the organization Authenticode certificate
        id: sign-installer-pfx
        continue-on-error: true
        if: steps.config.outputs.method == 'pfx'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "redrob-installer-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CSC_LINK))
            $password = ConvertTo-SecureString $env:WIN_CSC_KEY_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $cert.Thumbprint) { throw "the organization PFX did not import" }
            $result = Set-AuthenticodeSignature `
              -FilePath "${{ github.workspace }}\dist\redrob-code-x64-setup.exe" `
              -Certificate $cert -HashAlgorithm SHA256 -TimestampServer http://timestamp.digicert.com
            if (-not $result.SignerCertificate) {
              throw "Authenticode signing failed for the installer: $($result.StatusMessage)"
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      # Read back, on the same terms as the binaries: an unsigned installer is the one file a user
      # actually double-clicks, so it is the last thing that should be trusted on an exit code.
      - name: Verify the installer signature
        id: verify-installer
        continue-on-error: true
        if: steps.config.outputs.method != 'none'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = "${{ github.workspace }}\dist\redrob-code-x64-setup.exe"
          $sig = Get-AuthenticodeSignature $setup
          if (-not $sig.SignerCertificate) { throw "no Authenticode signer certificate on the installer" }
          $accepted = if ("${{ steps.config.outputs.method }}" -eq "azure") { @("Valid") } else { @("Valid", "UnknownError", "NotTrusted") }
          if ($accepted -notcontains $sig.Status.ToString()) {
            throw "unexpected signature status on the installer: $($sig.Status) $($sig.StatusMessage)"
          }
          Write-Host "redrob-code-x64-setup.exe: $($sig.Status), signer $($sig.SignerCertificate.Subject)"

      - name: Record the installer signing outcome
        id: installer-result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          method="${{ steps.config.outputs.method }}"
          case "$method" in
            azure) signed="${{ steps.sign-installer-azure.outcome }}" ;;
            pfx)   signed="${{ steps.sign-installer-pfx.outcome }}" ;;
            *)     signed="skipped" ;;
          esac
          if [ "${{ steps.installer.outcome }}" != "success" ]; then
            echo "installer=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the Windows installer was not built"
          elif [ "$signed" = "success" ] && [ "${{ steps.verify-installer.outcome }}" = "success" ]; then
            echo "installer=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Windows installer signed via $method and verified"
          else
            echo "installer=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the Windows installer in this release is NOT signed"
          fi

      - name: Repack
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          for directory in redrob-windows-*; do
            [ -d "$directory" ] || continue
            (cd "$directory/bin" && 7z a -tzip "../../${directory}.zip" . >/dev/null)
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-windows-signed
          path: |
            dist/redrob-windows-*.zip
            dist/redrob-code-x64-setup.exe

  publish:
    needs: [version, build, sign-macos, sign-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-unsigned
          path: unsigned

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-macos-signed
          path: assets

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-windows-signed
          path: assets

      - name: Pack the Linux binaries
        run: |
          set -euo pipefail
          cd unsigned
          for directory in redrob-linux-*; do
            [ -d "$directory" ] || continue
            (cd "$directory/bin" && zip -qr "../../../assets/${directory}.zip" .)
            # Both formats for Linux, and only for Linux. A minimal container routinely has
            # `tar` and no `unzip`, and install.sh running on a machine that cannot open the
            # archive it just downloaded is the failure this avoids. macOS ships `unzip` and
            # the Windows installer uses `Expand-Archive`, so those stay zip-only rather
            # than doubling every release's asset count for nothing.
            #
            # One `..`, not two: this runs from `unsigned/` while the zip above runs from
            # `$directory/bin`, so the same destination is a different number of levels up.
            tar -czf "../assets/${directory}.tar.gz" -C "$directory/bin" .
          done

      - name: Checksums
        working-directory: assets
        run: |
          set -euo pipefail
          # The installer is included deliberately: it is the file a Windows user actually
          # double-clicks, so it is the one that most needs a published digest. Guarded with a
          # glob test rather than assumed, because the installer step is `continue-on-error`
          # and a release without it must still produce checksums for everything else.
          set -- redrob-code-x64-setup.exe
          if [ -e "$1" ]; then
            sha256sum redrob-*.zip redrob-*.tar.gz redrob-code-x64-setup.exe > SHA256SUMS
          else
            echo "::warning::no installer present; SHA256SUMS will not cover one"
            sha256sum redrob-*.zip redrob-*.tar.gz > SHA256SUMS
          fi
          cat SHA256SUMS

      # The marker install.sh and `redrob upgrade` read to answer "what is the newest
      # version". Written AFTER the checksums so it is deliberately not one of the files
      # SHA256SUMS covers: it names a version rather than carrying a payload, and the
      # archive it points at is checksum-verified once fetched.
      #
      # `releases/latest/download/VERSION` resolves to whichever release is newest, so no
      # client has to hardcode a tag and nothing here consults the GitHub API, which is
      # rate limited to 60 requests an hour for an anonymous caller.
      - name: Write the latest-version marker
        working-directory: assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: printf '%s\n' "$VERSION" > VERSION

      # Lets anyone verify an artifact was produced by this repository and this workflow,
      # which a code signature alone does not establish -- a signature says the key was
      # used, not where.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/redrob-*.zip
            assets/redrob-*.tar.gz

      - name: Create the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          UPSTREAM: ${{ needs.version.outputs.upstream }}
          WINDOWS_SIGNED: ${{ needs.sign-windows.outputs.signed }}
          WINDOWS_INSTALLER: ${{ needs.sign-windows.outputs.installer }}
        run: |
          set -euo pipefail
          # An annotated tag records a tagger, and a bare runner has no git identity, so
          # `git tag -a` fails with "empty ident name" AFTER the build, the signing and the
          # notarization have all succeeded -- the most expensive possible place to
          # discover it. The tag stays annotated rather than lightweight because it is what
          # a release points at and it should say who made it and when.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "Built on [opencode v$UPSTREAM](https://github.com/anomalyco/opencode/releases/tag/v$UPSTREAM)."
            echo
            echo "Redrob Code has its own version line. This number is not upstream's and does"
            echo "not track it: what this build is based on is recorded in \`UPSTREAM_VERSION\`"
            echo "and stated above. See \`docs/VERSIONING.md\`."
            echo
            echo "## Installing"
            echo
            echo "macOS and Linux:"
            echo
            echo '```sh'
            echo "curl -fsSL https://console.redrob.ai/code/install.sh | sh"
            echo '```'
            echo
            echo "Windows, in PowerShell:"
            echo
            echo '```powershell'
            echo "irm https://console.redrob.ai/code/install.ps1 | iex"
            echo '```'
            echo
            echo "These releases are the only place builds are published. There is no CDN"
            echo "mirror, and an install from before 0.1.0 does not upgrade into this line:"
            echo "run the command above again to move onto it."
            echo
            echo "## Verifying"
            echo
            echo "macOS binaries are signed with a Developer ID certificate and notarized."
            if [ "$WINDOWS_INSTALLER" = "true" ]; then
              echo "Windows has a signed installer: download \`redrob-code-x64-setup.exe\` and run it."
              echo "It installs to \`%LOCALAPPDATA%\\Redrob\\bin\`, adds that to your user PATH, and"
              echo "needs no Administrator rights. Open a NEW terminal afterwards -- an already-open"
              echo "one still holds the old PATH."
              echo
            fi
            if [ "$WINDOWS_SIGNED" = "true" ]; then
              echo "Windows binaries are signed through Azure Trusted Signing."
            else
              echo "**Windows binaries in this release are NOT signed**, so Windows will show a"
              echo "SmartScreen warning on first run. Verify the archive against \`SHA256SUMS\`"
              echo "and the provenance attestation below before running it."
            fi
            echo
            echo "Every archive carries build provenance attesting it was produced by this"
            echo "workflow, which a code signature alone does not establish -- a signature says"
            echo "the key was used, not where:"
            echo
            echo '```sh'
            echo "gh attestation verify redrob-darwin-arm64.zip --repo ${{ github.repository }}"
            echo '```'
            echo
            echo "Checksums are in \`SHA256SUMS\`."
          } > notes.md
          git tag -a "$TAG" -m "Redrob Code $TAG (built on opencode v$UPSTREAM)" 2>/dev/null || \
            echo "tag $TAG already exists locally"
          # A release that fails after tagging must be retryable. Without this a single
          # transient failure in the steps below leaves the version permanently unusable:
          # the tag exists, so every retry dies on push before reaching the release.
          #
          # The tag is named explicitly. `--tags` and `--follow-tags` would push whatever
          # else happens to be in this checkout's tag namespace, which is how a tag nobody
          # decided to publish ends up published.
          git push origin "refs/tags/$TAG" 2>/dev/null || echo "tag $TAG is already on the remote"

          # The release is created EMPTY and the assets are uploaded one at a time, each
          # retried. `gh release create "$TAG" assets/*` uploads all twenty in one command and
          # rolls the whole release back when any single one fails, so a transient 5xx on the
          # nineteenth asset discards a run that has already spent forty minutes building,
          # signing and notarizing. That is not hypothetical: v0.1.0 lost two consecutive
          # attempts that way, to `504 Gateway Timeout` and `500 Error creating asset temp dir`
          # on different assets.
          #
          # Splitting it also collapses the create and re-run paths into one: an existing
          # release has its notes replaced and its assets clobbered, which is what a retry
          # needs anyway.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG exists; replacing its notes and assets"
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi

          failed=()
          for asset in assets/*; do
            [ -f "$asset" ] || continue
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$asset" --clobber; then
                uploaded=true
                break
              fi
              echo "::warning::upload of $(basename "$asset") failed on attempt $attempt"
              sleep $((attempt * 10))
            done
            if [ "$uploaded" = false ]; then
              failed+=("$(basename "$asset")")
            fi
          done

          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::these assets did not upload after three attempts: ${failed[*]}"
            echo "The release and tag exist, so re-running this job resumes rather than restarts."
            exit 1
          fi

          # A release missing an archive installs nothing on that platform while looking
          # published, so the asset list is checked rather than assumed.
          published="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          expected="$(find assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "$published" != "$expected" ]; then
            echo "::error::release $TAG has $published assets, expected $expected"
            exit 1
          fi
          echo "::notice::release $TAG published with $published assets"

      - name: Point at the promotion to main
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Deliberately does NOT open the pull request itself.
          #
          # `gh pr create` from a workflow needs "Allow GitHub Actions to create and
          # approve pull requests", and that one setting grants BOTH. In a public
          # repository, letting the Actions token approve pull requests means a workflow
          # can approve its own, which is worth more than the convenience of not clicking
          # a link. So this prints the link and a person opens it.
          #
          # Compared against the remote rather than a local ref: this job checks out
          # `develop` alone, so `origin/main` does not exist here and a
          # `git log origin/main..HEAD` would come back empty and read as "nothing to
          # promote" -- passing for the wrong reason, which is how the previous version of
          # this step silently did nothing.
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$main_sha" ]; then
            echo "::notice::no main branch yet; create it from $TAG to start tracking released state"
            exit 0
          fi
          if [ "$main_sha" = "$(git rev-parse HEAD)" ]; then
            echo "::notice::main already matches develop; nothing to promote"
            exit 0
          fi
          url="${{ github.server_url }}/${{ github.repository }}/compare/main...develop?expand=1"
          {
            echo "### Promote \`develop\` to \`main\` for $TAG"
            echo
            echo "The release is published. \`main\` still points at \`${main_sha:0:9}\`, so what"
            echo "the repository says is *released* has not moved yet."
            echo
            echo "[Open the promotion pull request]($url)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::release published; promote develop to main at $url"
