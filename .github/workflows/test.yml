name: test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Keep every run on main so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/main', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: unit (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
            required: true
          # Windows runs and reports, but does not block yet. The six hangs this
          # PR fixed are gone — the suite reports 934 tests, 0 failures — and then
          # the STEP sits for another ~17 minutes and dies at the 20-minute limit,
          # because something on Windows does not release after `bun test` returns.
          # The log shows "failed to abort ACP backing session", "decode failed"
          # and "notification failed" around that point. Linux exits cleanly in
          # 9m23s. Until whatever holds that handle is found, making this required
          # would mean shipping a gate that cannot pass; remove `required: false`
          # in the same change that fixes the non-exit.
          - name: windows
            host: windows-latest
            required: false
    runs-on: ${{ matrix.settings.host }}
    continue-on-error: ${{ !matrix.settings.required }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The ripgrep tests resolve `rg` from PATH, then a cache dir, and only then
      # download it from github.com. Relying on that download made five tests hang
      # to the harness timeout on the Windows runner with nothing in the log naming
      # a download as the cause. Provisioning it here means the tests exercise
      # ripgrep rather than the network. `binary.ts` still bounds the download for
      # anyone running without this step.
      - name: Provision ripgrep
        run: |
          set -euo pipefail
          if command -v rg >/dev/null 2>&1; then
            echo "rg already present: $(rg --version | head -1)"
            exit 0
          fi
          case "${{ matrix.settings.name }}" in
            linux)   sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep ;;
            windows) choco install ripgrep -y --no-progress ;;
          esac
          rg --version | head -1

      - name: Configure git identity
        run: |
          git config --global user.email "bot@code.redrob.ai"
          git config --global user.name "redrob"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run unit tests
        timeout-minutes: 20
        run: GITHUB_ACTIONS=false bun turbo test
        env:
          REDROB_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Check generated client
        if: runner.os == 'Linux'
        working-directory: packages/client
        run: bun run check:generated

      - name: Run HttpApi exerciser gates
        if: runner.os == 'Linux'
        working-directory: packages/redrob
        run: bun run test:httpapi
