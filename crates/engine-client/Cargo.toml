[package]
name = "redrob-engine-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/redrob-labs/redrob-code"
description = "Find, start, watch and stop the shared Redrob Code daemon from a Rust app: the record in ~/.redrob/run/server.json, its health, who is attached, and the engine's OpenAI-compatible base"
# Lives beside the engine contract it implements (docs/LOCAL-ENGINE-API.md, section 3) so that
# every Rust Redrob app (Shape, Canvas, Query, Recall, the launcher) reaches the one daemon the
# same way. Apps depend on it as a git dependency pinned to the engine tag they target:
#   redrob-engine-client = { git = "https://github.com/redrob-labs/redrob-code", tag = "v0.6.3" }
# No crates.io publish yet; flip `publish` when a registry token exists.
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
dirs = "6"
base64 = "0.22"
# Plain HTTP to 127.0.0.1 only: the daemon never listens elsewhere, so no TLS is built in.
ureq = { version = "3.4", default-features = false }

[dev-dependencies]
tempfile = "3"
